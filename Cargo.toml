[workspace]
resolver = "2"
members = [
    "sdk/aios-block-sdk",
    "blocks/calculator",
    "blocks/minesweeper",
    "tools/indexgen",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
